<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haven</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      /* Paint our own background: the Even app WebView can show a light page behind
         dark-mode (white) text. Canvas/CanvasText always follow color-scheme together. */
      body {
        background: Canvas;
        color: CanvasText;
        margin: 0;
        padding: 16px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <!-- Phone-side UI (pairing, contacts). The glasses HUD is drawn through the Even Hub SDK. -->
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
